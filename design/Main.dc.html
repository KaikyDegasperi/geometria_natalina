<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    :root {
      --pine: #0f3d2e;
      --pine-2: #14533f;
      --holly: #b5233a;
      --holly-2: #8f1c2e;
      --gold: #d9a441;
      --gold-2: #b9832e;
      --snow: #f7f5ee;
      --ink: #17241f;
      --muted: #5c6d63;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Nunito', system-ui, sans-serif; color: var(--ink); }
    a { color: var(--gold-2); }
    a:hover { color: var(--holly); }
    h1, h2, h3, .display { font-family: 'Fredoka', system-ui, sans-serif; }
  </style>
</helmet>

<div style="width:390px; min-height:844px; background: linear-gradient(180deg, #0c2e23 0%, #123a2c 55%, #0f3d2e 100%); position:relative; overflow:hidden;">

  <!-- snow dots -->
  <svg width="390" height="844" style="position:absolute; top:0; left:0; opacity:0.5; pointer-events:none;">
    <circle cx="30" cy="40" r="2" fill="#ffffff"/>
    <circle cx="80" cy="90" r="1.5" fill="#ffffff"/>
    <circle cx="340" cy="60" r="2" fill="#ffffff"/>
    <circle cx="360" cy="150" r="1.5" fill="#ffffff"/>
    <circle cx="20" cy="200" r="1.5" fill="#ffffff"/>
    <circle cx="300" cy="20" r="1.5" fill="#ffffff"/>
    <circle cx="150" cy="30" r="1.5" fill="#ffffff"/>
  </svg>

  <!-- header -->
  <div style="display:flex; flex-direction:column; gap:14px; padding:20px 20px 16px 20px; position:relative;">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:36px; height:36px; border-radius:10px; background:var(--holly); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 0 var(--holly-2);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/></svg>
        </div>
        <div style="display:flex; flex-direction:column; line-height:1.1;">
          <span style="color:#f2ead6; font-size:11px; letter-spacing:0.06em; opacity:0.7;">DESAFIO 2</span>
          <span class="display" style="color:#fff; font-size:16px; font-weight:600;">Árvore de Natal</span>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.08); border:1px solid rgba(217,164,65,0.35); border-radius:999px; padding:6px 12px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--gold)"><path d="M12 2l2.9 6.26L22 9.27l-5 4.87L18.2 21 12 17.27 5.8 21 7 14.14l-5-4.87 7.1-1.01z"/></svg>
        <span style="color:#fff; font-weight:800; font-size:14px;">240 XP</span>
      </div>
    </div>

    <!-- level progress -->
    <div style="display:flex; flex-direction:column; gap:6px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="color:#f2ead6; font-size:12px; font-weight:700;">Nível 2</span>
        <span style="color:#c9d6cd; font-size:11px;">90 XP para o nível 3</span>
      </div>
      <div style="width:100%; height:8px; border-radius:999px; background:rgba(255,255,255,0.12); overflow:hidden;">
        <div style="width:62%; height:100%; border-radius:999px; background:linear-gradient(90deg, var(--gold-2), var(--gold));"></div>
      </div>
    </div>
  </div>

  <!-- mission card -->
  <div style="margin:0 20px 14px 20px; background:rgba(255,255,255,0.95); border-radius:16px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; box-shadow:0 6px 18px rgba(0,0,0,0.25);">
    <div style="width:34px; height:34px; border-radius:10px; background:var(--pine); flex-shrink:0; display:flex; align-items:center; justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f7f5ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 5H9zM12 7l4 6H8zM12 13l5 7H7z"/></svg>
    </div>
    <div style="display:flex; flex-direction:column; gap:2px;">
      <span style="font-size:12px; font-weight:800; color:var(--holly); letter-spacing:0.03em;">SUA MISSÃO</span>
      <span style="font-size:14px; color:var(--ink); font-weight:600;">Marque o ponto <span style="color:var(--pine-2);">(3, 4)</span> para continuar a árvore</span>
    </div>
  </div>

  <!-- cartesian plane card -->
  <div style="margin:0 20px 14px 20px; background:var(--snow); border-radius:18px; padding:14px; box-shadow:0 8px 24px rgba(0,0,0,0.28);">
    <svg width="100%" height="300" viewBox="0 0 320 300" style="display:block;">
      <!-- grid -->
      <g stroke="#dcd6c4" stroke-width="1">
        <line x1="0" y1="30" x2="320" y2="30"/><line x1="0" y1="60" x2="320" y2="60"/>
        <line x1="0" y1="90" x2="320" y2="90"/><line x1="0" y1="120" x2="320" y2="120"/>
        <line x1="0" y1="150" x2="320" y2="150"/><line x1="0" y1="180" x2="320" y2="180"/>
        <line x1="0" y1="210" x2="320" y2="210"/><line x1="0" y1="240" x2="320" y2="240"/>
        <line x1="0" y1="270" x2="320" y2="270"/>
        <line x1="20" y1="0" x2="20" y2="300"/><line x1="50" y1="0" x2="50" y2="300"/>
        <line x1="80" y1="0" x2="80" y2="300"/><line x1="110" y1="0" x2="110" y2="300"/>
        <line x1="140" y1="0" x2="140" y2="300"/><line x1="170" y1="0" x2="170" y2="300"/>
        <line x1="200" y1="0" x2="200" y2="300"/><line x1="230" y1="0" x2="230" y2="300"/>
        <line x1="260" y1="0" x2="260" y2="300"/><line x1="290" y1="0" x2="290" y2="300"/>
      </g>
      <!-- axes -->
      <line x1="0" y1="270" x2="320" y2="270" stroke="var(--ink)" stroke-width="2"/>
      <line x1="20" y1="0" x2="20" y2="300" stroke="var(--ink)" stroke-width="2"/>
      <!-- tree segments so far -->
      <polyline points="20,270 80,210 50,210 110,150 65,150 140,90" fill="none" stroke="var(--pine-2)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="20" cy="270" r="5" fill="var(--pine-2)"/>
      <circle cx="80" cy="210" r="5" fill="var(--pine-2)"/>
      <circle cx="50" cy="210" r="5" fill="var(--pine-2)"/>
      <circle cx="110" cy="150" r="5" fill="var(--pine-2)"/>
      <circle cx="65" cy="150" r="5" fill="var(--pine-2)"/>
      <circle cx="140" cy="90" r="6" fill="var(--gold)" stroke="#fff" stroke-width="2"/>
      <!-- next target ghost point pulsing -->
      <circle cx="170" cy="150" r="9" fill="rgba(181,35,58,0.15)" stroke="var(--holly)" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="170" y="145" text-anchor="middle" font-size="9" fill="var(--holly)" font-weight="700">(3,4)</text>
    </svg>
  </div>

  <!-- feedback toast -->
  <div style="margin:0 20px 14px 20px; display:flex; align-items:center; gap:10px; background:rgba(15,61,46,0.85); border:1px solid rgba(217,164,65,0.4); border-radius:14px; padding:10px 14px;">
    <div style="width:26px; height:26px; border-radius:999px; background:var(--gold); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0f3d2e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <span style="color:#f2ead6; font-size:13px; font-weight:700;">Correto! +10 XP · ponto (2,3) marcado</span>
  </div>

  <!-- stars / stats row -->
  <div style="display:flex; gap:10px; padding:0 20px 24px 20px;">
    <div style="flex:1; background:rgba(255,255,255,0.08); border-radius:14px; padding:10px; display:flex; flex-direction:column; align-items:center; gap:4px;">
      <div style="display:flex; gap:2px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--gold)"><path d="M12 2l2.9 6.26L22 9.27l-5 4.87L18.2 21 12 17.27 5.8 21 7 14.14l-5-4.87 7.1-1.01z"/></svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--gold)"><path d="M12 2l2.9 6.26L22 9.27l-5 4.87L18.2 21 12 17.27 5.8 21 7 14.14l-5-4.87 7.1-1.01z"/></svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="rgba(255,255,255,0.25)"><path d="M12 2l2.9 6.26L22 9.27l-5 4.87L18.2 21 12 17.27 5.8 21 7 14.14l-5-4.87 7.1-1.01z"/></svg>
      </div>
      <span style="color:#c9d6cd; font-size:11px; font-weight:700;">Estrelas</span>
    </div>
    <div style="flex:1; background:rgba(255,255,255,0.08); border-radius:14px; padding:10px; display:flex; flex-direction:column; align-items:center; gap:4px;">
      <span style="color:#fff; font-size:16px; font-weight:800;">5 / 8</span>
      <span style="color:#c9d6cd; font-size:11px; font-weight:700;">Pontos</span>
    </div>
    <div style="flex:1; background:rgba(255,255,255,0.08); border-radius:14px; padding:10px; display:flex; flex-direction:column; align-items:center; gap:4px;">
      <span style="color:#fff; font-size:16px; font-weight:800;">7</span>
      <span style="color:#c9d6cd; font-size:11px; font-weight:700;">Tentativas</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
